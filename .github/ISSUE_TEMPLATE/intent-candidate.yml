name: MindShift Research Hypothesis
description: Capture an observation, pattern, candidate abstraction, and transfer question.
title: "Research Hypothesis: "
labels:
  - mindshift-research
body:
  - type: textarea
    id: observation
    attributes:
      label: Observation
      description: What was observed?
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: Pattern
      description: What recurring relationship or structure appears in the observation?
    validations:
      required: true
  - type: textarea
    id: candidate-abstraction
    attributes:
      label: Candidate Abstraction
      description: What abstraction or distinction may compress the pattern?
    validations:
      required: true
  - type: textarea
    id: transfer-question
    attributes:
      label: Transfer Question
      description: Where might this abstraction transfer, and where might it fail?
    validations:
      required: true
  - type: textarea
    id: modeling-value
    attributes:
      label: Future Modeling Value
      description: How could this improve future modeling?
    validations:
      required: true
