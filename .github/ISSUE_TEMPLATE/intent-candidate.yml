name: MindShift Early-Stage Hypothesis Intake
description: Capture an early-stage observation, pattern, candidate abstraction, and transfer question.
title: "Research Hypothesis: "
labels:
  - mindshift-research
body:
  - type: markdown
    attributes:
      value: |
        ## Early-stage hypothesis intake

        This form is a descriptive intake artifact, not a complete analysis
        record or an executable instruction.

        Candidate primitive selection, transfer results, and closure disposition
        are intentionally deferred. Complete those later-stage analysis sections,
        including contradictory evidence and confidence updates, in a
        [Grandmaster Mode analysis](../../blob/main/docs/grandmaster-mode.md).
  - type: textarea
    id: observation
    attributes:
      label: Observation
      description: What was observed?
    validations:
      required: true
  - type: dropdown
    id: observation-class
    attributes:
      label: Observation Class
      description: How does this observation relate to the phenomenon?
      options:
        - Empirical — directly observed or measured
        - Reported — received through an account or documentation
        - Synthetic — generated by a model, simulation, or constructed process
        - Illustrative — invented or simplified for explanation or exploration
    validations:
      required: true
  - type: textarea
    id: observation-provenance
    attributes:
      label: Observation Provenance and Limitations
      description: Complete every field; write "Unknown" or "None identified" rather than inferring missing information.
      placeholder: |
        Observation context:
        Collection method:
        Temporal scope:
        Observer or custodian:
        Known limitations:
        Contradictory evidence:
        Confidence and basis:
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: Pattern
      description: What recurring relationship or structure appears in the observation?
    validations:
      required: true
  - type: textarea
    id: candidate-abstraction
    attributes:
      label: Candidate Abstraction
      description: What abstraction or distinction may compress the pattern?
    validations:
      required: true
  - type: textarea
    id: transfer-question
    attributes:
      label: Transfer Question
      description: Where might this abstraction transfer, and where might it fail?
    validations:
      required: true
  - type: textarea
    id: modeling-value
    attributes:
      label: Future Modeling Value
      description: How could this improve future modeling?
    validations:
      required: true
