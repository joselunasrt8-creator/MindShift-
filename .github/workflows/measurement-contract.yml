name: Measurement contract validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  measurement-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate InstrumentRunRecord schema and stdlib collector
        run: python -m unittest discover -s tests/measurement -v
