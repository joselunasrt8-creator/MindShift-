name: MindShift Runtime Check

on:
  pull_request:
  push:

jobs:
  non-operative-notice:
    name: Non-operative runtime notice
    runs-on: ubuntu-latest
    steps:
      - name: State non-operative boundary
        run: |
          echo "MindShift runtime check is non-operative."
          echo "It creates no authority, proof, eligibility change, release action, repository integration action, or external execution."
