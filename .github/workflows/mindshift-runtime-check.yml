name: MindShift Runtime Check

on:
  pull_request:
  push:

jobs:
  non-operative-notice:
    name: Non-operative notice only
    runs-on: ubuntu-latest
    steps:
      - name: Runtime check intentionally non-operative
        shell: bash
        run: |
          set -euo pipefail
          echo "MindShift runtime workflows are non-operative."
          echo "This workflow does not checkout code, use external actions, create authority, create proof, change eligibility, deploy, merge, or call external services."
