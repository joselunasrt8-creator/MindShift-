name: MindShift Runtime Check

on:
  pull_request:
  push:

jobs:
  file-presence:
    name: File presence only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check runtime files exist
        run: |
          test -f runtime/RUNTIME.md
          test -f runtime/learning/README.md
          test -f runtime/learning/example-learning-log.md
